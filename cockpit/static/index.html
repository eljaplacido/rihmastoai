<body>
<a class="skip" id="skip" href="#main">Skip to content</a>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Cockpit navigation">
    <div class="sb-top">
      <a class="brand rail-tip" href="#/home" aria-label="Rihmasto cockpit: home" data-tip="Rihmasto cockpit">
        <img class="brand-mark" src="/static/rihmasto-mark.png" alt="" width="32" height="32">
        <span class="brand-text"><b>Rihmasto</b><small>your projects</small></span>
      </a>
      <button type="button" class="icon-btn sb-collapse" id="sb-collapse" aria-label="Collapse the sidebar" aria-expanded="true" aria-controls="sidebar" data-tip="Collapse the sidebar"><svg class="ic"><use href="#i-panel-left"/></svg></button>
      <button type="button" class="icon-btn sb-close" id="sb-close" aria-label="Close the navigation" data-tip="Close the navigation (Esc)"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <button type="button" class="btn primary sb-new" id="sb-new" data-control="new_project" data-tip="New project"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">New project</span></button>
    <nav class="sb-nav" id="sb-nav" aria-label="Pages"></nav>
    <nav class="sb-nav sb-project" id="sb-project" aria-label="Project views" hidden></nav>
    <div class="sb-foot" id="sb-foot"></div>
  </aside>
  <div class="frame">
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn tb-menu" id="tb-menu" aria-label="Navigation" aria-controls="sidebar" aria-expanded="false" data-tip="Navigation"><svg class="ic"><use href="#i-menu"/></svg></button>
      <span class="tb-fill"></span>
      <span class="lens-lbl" id="lens-lbl" aria-hidden="true">View as</span>
      <div class="lens-switch" id="lens-switch" role="radiogroup" aria-label="View as" data-control="lens"></div>
      <div class="tb-right">
        <button type="button" class="search-btn" id="jump" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" data-control="palette"><svg class="ic"><use href="#i-search"/></svg><span class="lbl">Search or jump</span><kbd id="jump-key">Ctrl K</kbd></button>
        <button type="button" class="icon-btn" id="density" aria-label="Density: comfortable" data-control="density" data-tip="Density"><svg class="ic"><use href="#i-rows"/></svg></button>
        <button type="button" class="icon-btn" id="theme" aria-label="Theme: system" data-control="theme" data-tip="Theme"><svg class="ic"><use href="#i-monitor"/></svg></button>
        <button type="button" class="btn tb-customize" id="customize" data-control="customize" aria-pressed="false"><svg class="ic"><use href="#i-sliders"/></svg><span class="lbl">Customize</span></button>
        <span class="access-note" id="access-note" role="note" data-control="access" hidden><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg><span class="an-text" id="access-note-text"></span></span>
        <button type="button" class="person-chip" id="person-chip" aria-haspopup="dialog" aria-expanded="false" data-control="persona"><span class="avatar" id="pc-avatar" aria-hidden="true">?</span><span class="pc-text"><b id="pc-name">Set your name</b><small id="pc-persona">Your role</small></span><svg class="ic chev"><use href="#i-chevron-down"/></svg></button>
      </div>
    </header>
    <nav class="scopebar" id="scopebar" aria-label="Scope"></nav>
    <div class="toasts" id="status" role="status" aria-live="polite"></div>
    <main id="main" tabindex="-1">
      <noscript><p>The cockpit needs JavaScript.</p></noscript>
    </main>
  </div>
</div>
<nav class="bottombar" id="bottombar" aria-label="Pages"></nav>
<button type="button" class="fab" id="assistant-fab" aria-controls="assistant" aria-expanded="false" aria-keyshortcuts="/" data-control="assistant"><svg class="ic"><use href="#i-bot"/></svg><span class="lbl">Ask Rihma</span><kbd>/</kbd></button>
<aside class="drawer" id="assistant" aria-labelledby="as-h" hidden>
  <div class="dr-head">
    <span class="bot-av" aria-hidden="true"><svg class="ic"><use href="#i-bot"/></svg></span>
    <div class="dr-title"><h2 id="as-h">Assistant</h2><p id="as-mode" class="muted small"></p></div>
    <button type="button" class="icon-btn" id="as-walk" aria-label="Walkthroughs" data-tip="Walkthroughs: Rihma walks you through it" data-control="walkthroughs"><svg class="ic"><use href="#i-flag"/></svg></button>
    <button type="button" class="icon-btn" id="as-clear" aria-label="Clear the conversation" data-tip="Clear the conversation"><svg class="ic"><use href="#i-refresh"/></svg></button>
    <button type="button" class="icon-btn" id="as-close" aria-label="Close the assistant" data-tip="Close (Esc)"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="as-scope" id="as-scope" role="group" aria-label="What Rihma talks about"></div>
  <div class="dr-body" id="as-log" aria-live="polite"></div>
  <div class="dr-suggest" id="as-suggest" aria-label="Suggested questions"></div>
  <form class="dr-compose" id="as-form" novalidate>
    <label for="as-q" class="vh">Ask the assistant</label>
    <textarea id="as-q" rows="2" maxlength="2000" placeholder="Ask where something is, how a run goes, or to change the layout"></textarea>
    <button type="submit" class="icon-btn send" id="as-send" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
  </form>
  <p class="dr-note muted small">It proposes; you confirm. Every action is signed with your name.</p>
</aside>
<div class="popover" id="person-pop" role="dialog" aria-labelledby="pp-h" hidden>
  <h2 id="pp-h" class="pop-h">Who you are</h2>
  <p class="access-pop muted small" id="access-pop" data-control="access" hidden></p>
  <div class="field"><label for="person">Your name</label><input id="person" name="person" autocomplete="name" placeholder="for example Aino" maxlength="200" spellcheck="false"></div>
  <fieldset class="persona-list"><legend>Your role</legend><div id="persona-list" role="radiogroup" aria-label="Your role"></div></fieldset>
  <p class="muted small" id="persona-note"></p>
  <div class="pp-theme field" id="pp-theme" role="group" aria-label="Theme"></div>
  <div class="pop-foot"><button type="button" class="btn quiet" id="newlink"><svg class="ic"><use href="#i-link"/></svg>Open in another browser tab</button><button type="button" class="btn primary" id="pp-done">Done</button></div>
  <div id="linkbox" class="linkbox" hidden>
    <label for="linkurl">One-use sign-in link for another tab (valid for 10 minutes)</label>
    <div class="row"><input id="linkurl" readonly spellcheck="false"><button type="button" class="btn" id="linkcopy"><svg class="ic"><use href="#i-copy"/></svg>Copy</button></div>
  </div>
</div>
<div class="popover menu-pop" id="menu-pop" role="menu" hidden></div>
<div class="tooltip" id="tip" role="tooltip" hidden></div>
<dialog id="palette" class="palette" aria-labelledby="pal-h" aria-describedby="pal-hint">
  <div class="pal-in">
    <div class="pal-top">
      <svg class="ic"><use href="#i-search"/></svg>
      <h2 id="pal-h" class="vh">Jump to</h2>
      <label for="pal-q" class="vh">Filter pages, projects, views and open cards</label>
      <input id="pal-q" type="text" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Jump to a page, a project, a view or a card">
      <button type="button" class="btn quiet" id="pal-close">Esc</button>
    </div>
    <ul id="pal-list" role="listbox" aria-label="Matches"></ul>
    <p id="pal-empty" class="pal-empty muted" hidden></p>
    <p id="pal-hint" class="pal-hint"><kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close</p>
    <p id="pal-count" class="vh" aria-live="polite"></p>
  </div>
</dialog>
<dialog id="modal" class="modal" aria-labelledby="modal-h"></dialog>
