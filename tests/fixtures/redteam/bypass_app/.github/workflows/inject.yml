name: inject
on:
  issues:
    types: [opened]
  pull_request_target:
jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - run: echo "New issue: ${{ github.event['issue']['title'] }}"  # seeded: RT-GHA-INJECT
      - run: echo '${{ toJSON(github.event) }}' > event.json  # seeded: RT-GHA-INJECT
      - run: echo "Checking ${{ env.TITLE }}"  # seeded: RT-GHA-INJECT
      - {name: greet, run: "echo ${{ github.event.issue.title }}"}  # seeded: RT-GHA-INJECT
      - "run": echo "${{ github.event.issue.title }}"  # seeded: RT-GHA-INJECT
      # seeded below: RT-GHA-INJECT
      - run: echo "${{ github.event.issue.body
          }}"
      - id: meta
        env:
          REF: ${{ github.head_ref }}
        run: echo "branch=$REF" >> "$GITHUB_OUTPUT"
      - run: git log origin/${{ steps.meta.outputs.branch }}  # seeded: RT-GHA-INJECT
