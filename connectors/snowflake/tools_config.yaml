# The service configuration the pinned Snowflake MCP server runs with: reads only. Object listing and
# description, and SELECT, SHOW and DESCRIBE statements; every statement that writes is off, and no
# Cortex service is configured. server.pin.sha256 pins this file: any change stops the connector until
# IT decides a new connector card.
#
# UNVERIFIED offline: the keys follow the server's documented service configuration file as recalled,
# not as read from a running server of the pinned version. Check them when the connector is set up.
agent_services: []
search_services: []
analyst_services: []
other_services:
  object_manager: True
  query_manager: True
  semantic_manager: False
sql_statement_permissions:
  - Select: True
  - Show: True
  - Describe: True
  - Use: True
  - Alter: False
  - Command: False
  - Comment: False
  - Commit: False
  - Create: False
  - Delete: False
  - Drop: False
  - Insert: False
  - Merge: False
  - Rollback: False
  - Transaction: False
  - TruncateTable: False
  - Update: False
  - Unknown: False
