# A release (FR-REL1; docs/maintainers.md, "Publish a version"): when a person pushes a version tag
# such as v1.0.0, the suite and the contract run again, tools/release_build.py builds the source
# archives, a CycloneDX SBOM, the checksums and the notes from CHANGELOG.md, GitHub signs a build
# provenance attestation for them, and a GitHub Release publishes them. "Run workflow"
# (workflow_dispatch) is a rehearsal: it builds and keeps the files as a workflow artifact, and
# publishes nothing. Standard-library Python only.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks before a release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure git for the tests
        run: |
          git config --global user.name "Rihmasto CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Test suite
        run: python -m unittest discover -s tests

      - name: Contract check
        run: python tools/contract_check.py contract/contract.json

      - name: Contract trace
        run: python tools/contract_trace.py contract/contract.json

  build:
    name: Build the release files
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.build.outputs.version }}
      prerelease: ${{ steps.build.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        id: build
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            python tools/release_build.py --tag "$TAG" --out dist > built.json
          else
            python tools/release_build.py --dry-run --out dist > built.json
          fi
          cat built.json
          python -c "import json; b = json.load(open('built.json')); print('version=' + b['version']); print('prerelease=' + str(b['prerelease']).lower())" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cdx.json

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --verify-tag --title "Rihmasto $VERSION" --notes-file dist/RELEASE_NOTES.md $flags \
            dist/*.tar.gz dist/*.zip dist/*.cdx.json dist/SHA256SUMS
